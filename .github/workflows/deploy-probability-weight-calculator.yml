name: Deploy Probability Weight Calculator

on:
  push:
    branches: [main]
    paths:
      - "probability-weight-calculator/**"
      - ".github/workflows/deploy-probability-weight-calculator.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: probability-weight-calculator

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
