<title>记账报税助手</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="app-css">
/* ---------- 设计变量 ----------
   主题有三种状态：显式 light / 显式 dark / 未标记（跟随系统）。
   只写 @media 会漏掉查看器显式打的 data-theme，所以两种都要写。 */
:root {
  color-scheme: light dark;

  /* 偏冷的中性色，和强调色（账本蓝）同一色相，比纯灰更像「选过的」 */
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #edf0f6;
  --border: #dfe3ec;
  --border-strong: #c7ccd9;
  --text: #131722;
  --text-muted: #5c6474;
  --text-faint: #8b93a3;

  --accent: #2f4f92;
  --accent-soft: rgba(47, 79, 146, 0.1);
  --income: #0e8f74;
  --income-soft: rgba(14, 143, 116, 0.12);
  --expense: #c23b32;
  --expense-soft: rgba(194, 59, 50, 0.12);
  --advisory: #a2650a;
  --advisory-soft: rgba(162, 101, 10, 0.12);

  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16, 18, 24, 0.05), 0 8px 24px rgba(16, 18, 24, 0.05);
  --wrap: 1120px;

  --font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216;
    --surface: #171b22;
    --surface-2: #1e232c;
    --border: #2a303b;
    --border-strong: #3b424f;
    --text: #e7e9ee;
    --text-muted: #99a1af;
    --text-faint: #6c7482;

    --accent: #7d9de8;
    --accent-soft: rgba(125, 157, 232, 0.16);
    --income: #3fbf98;
    --income-soft: rgba(63, 191, 152, 0.15);
    --expense: #f0796f;
    --expense-soft: rgba(240, 121, 111, 0.15);
    --advisory: #e0a542;
    --advisory-soft: rgba(224, 165, 66, 0.16);

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.28);
  }
}

:root[data-theme="dark"] {
  --bg: #0f1216;
  --surface: #171b22;
  --surface-2: #1e232c;
  --border: #2a303b;
  --border-strong: #3b424f;
  --text: #e7e9ee;
  --text-muted: #99a1af;
  --text-faint: #6c7482;

  --accent: #7d9de8;
  --accent-soft: rgba(125, 157, 232, 0.16);
  --income: #3fbf98;
  --income-soft: rgba(63, 191, 152, 0.15);
  --expense: #f0796f;
  --expense-soft: rgba(240, 121, 111, 0.15);
  --advisory: #e0a542;
  --advisory-soft: rgba(224, 165, 66, 0.16);

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.28);
}

/* ---------- 基础 ---------- */
* { box-sizing: border-box; }

/* 平台包装层只存在于第一版；页面自发布后是完整文档，这些得自己带上 */
[hidden] { display: none !important; }
img { max-width: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 var(--font-text);
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 20px; }

h1, h2 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.tnum, .stat-value, .record-amount, .day-head, .bar-value, .amount-cell,
.count, #grossAmount, .filters select, .report-table td.num {
  font-variant-numeric: tabular-nums;
}

.stat-value, .record-amount, .amount-cell, #grossAmount, .report-table td.num {
  font-family: var(--font-mono);
  letter-spacing: -0.01em;
}

/* ---------- 顶栏与提示条 ---------- */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  height: 60px;
  flex-wrap: wrap;
}

.brand { font-size: 17px; }
.topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.compliance-banner {
  background: var(--advisory-soft);
  color: var(--advisory);
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
  line-height: 1.6;
}
.compliance-banner .wrap { padding: 10px 20px; }
.compliance-banner strong { color: inherit; }

.banner { margin: 0; padding: 10px 20px; font-size: 13px; text-align: center; }
.banner-warn { background: var(--expense-soft); color: var(--expense); }

.notice {
  margin: 0 0 14px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  background: var(--advisory-soft);
  color: var(--advisory);
  font-size: 12.5px;
}
.notice-tight { margin: 14px 0 10px; }

/* ---------- 按钮 ---------- */
.btn {
  font: inherit; font-size: 14px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.05s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 10px 22px; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--expense); border-color: transparent; }
.btn-danger:hover { background: var(--expense-soft); }

/* ---------- 卡片通用 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-top: 20px;
}
.card:first-of-type { margin-top: 24px; }
.card-title { font-size: 15px; white-space: nowrap; }
/* 侧栏较窄时标题和右侧的期间选择器放不到一行，让选择器换到下一行，
   而不是把标题文字硬挤断行（中文换行不需要空格，挤压时很容易断词）。 */
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.count { color: var(--text-faint); font-size: 13px; }

/* ---------- 税务参数面板 ---------- */
.settings-card { padding: 0; overflow: hidden; }
.settings-toggle {
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 16px 20px;
  background: none; border: 0; cursor: pointer;
  font: inherit; color: inherit; text-align: left;
}
.settings-summary { flex: 1; color: var(--text-muted); font-size: 13px; }
.chevron { color: var(--text-faint); transition: transform 0.15s; }
.settings-toggle[aria-expanded="true"] .chevron { transform: rotate(90deg); }
.settings-body { padding: 0 20px 20px; }

.field-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.field-row-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.advanced { margin: 4px 0 16px; }
.advanced summary { cursor: pointer; font-size: 13px; color: var(--text-muted); padding: 4px 0; }
.advanced[open] summary { color: var(--text); }
.advanced .field-row { margin-top: 12px; }

.save-hint { font-size: 13px; color: var(--income); }

/* ---------- 表单元件 ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
.optional { font-weight: 400; color: var(--text-faint); }

input[type="text"], input[type="search"], input[type="date"], select {
  width: 100%; font: inherit;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
}
input::placeholder { color: var(--text-faint); }

.segmented { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-sm); padding: 3px; }
.segment input { position: absolute; opacity: 0; pointer-events: none; }
.segment span {
  display: block; padding: 7px 22px; border-radius: 6px;
  font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.segment-expense input:checked + span { background: var(--surface); color: var(--expense); box-shadow: var(--shadow); }
.segment-income input:checked + span { background: var(--surface); color: var(--income); box-shadow: var(--shadow); }
.segmented .segment:not(.segment-expense):not(.segment-income) input:checked + span { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.segment input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.form-card .field-row { grid-template-columns: minmax(0, 1fr) 200px; align-items: start; }
.form-card .field-row + .field-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

.amount-input { position: relative; }
.amount-input .currency { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 18px; }
#grossAmount { padding-left: 30px; font-size: 22px; font-weight: 650; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
.chip {
  font: inherit; font-size: 13px; padding: 4px 11px;
  border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text-muted); cursor: pointer;
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.tax-preview {
  display: flex; gap: 18px; flex-wrap: wrap;
  padding: 10px 12px; margin-bottom: 14px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-size: 13px; color: var(--text-muted);
}
.tax-preview b { font-family: var(--font-mono); color: var(--text); }

.error { min-height: 16px; margin: 4px 0 0; font-size: 12px; color: var(--expense); }
.field input[aria-invalid="true"] { border-color: var(--expense); }
.form-actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }

/* ---------- 汇总卡 ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.stat-label { display: block; font-size: 12px; color: var(--text-muted); }
.stat-value { display: block; margin-top: 4px; font-size: 21px; font-weight: 650; letter-spacing: -0.02em; }
.stat-income .stat-value { color: var(--income); }
.stat-expense .stat-value { color: var(--expense); }

/* ---------- 布局 ---------- */
.columns { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.side { display: grid; gap: 0; }
.side .card:first-child { margin-top: 0; }

/* ---------- 明细列表 ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
.filters select { width: auto; flex: 0 0 auto; font-size: 13px; padding: 7px 10px; }
.filters input[type="search"] { flex: 1 1 150px; min-width: 0; font-size: 13px; padding: 7px 10px; }

.records { list-style: none; margin: 8px 0 0; padding: 0; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 6px; font-size: 12px; color: var(--text-faint); border-bottom: 1px solid var(--border); }
.day-head .day-sum { font-variant-numeric: tabular-nums; }

.record { display: flex; align-items: flex-start; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--border); }
.record:hover { background: var(--surface-2); }
.record-main { flex: 1; min-width: 0; }
.record-category { font-weight: 600; }
.record-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; font-size: 12px; color: var(--text-muted); }
.record-note { font-size: 13px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; }
.tag { padding: 1px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
.tag-special { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }

.record-amount { text-align: right; white-space: nowrap; }
.record-amount .gross { font-weight: 650; font-family: var(--font-mono); }
.record-amount.income .gross { color: var(--income); }
.record-amount.expense .gross { color: var(--expense); }
.record-amount .tax { display: block; font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }

.record-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
.record:hover .record-actions, .record:focus-within .record-actions { opacity: 1; }
.icon-btn { font: inherit; font-size: 13px; padding: 5px 9px; border: 0; border-radius: 6px; background: transparent; color: var(--text-muted); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover { background: var(--expense-soft); color: var(--expense); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.empty { padding: 32px 8px; text-align: center; color: var(--text-faint); font-size: 14px; }

/* ---------- 报表 ---------- */
.report-table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 6px; }
.report-table td { padding: 6px 0; border-bottom: 1px dashed var(--border); }
.report-table td.label { color: var(--text-muted); }
.report-table td.num { text-align: right; }
.report-table tr.total td { border-bottom: none; border-top: 1px solid var(--border-strong); padding-top: 9px; font-weight: 650; }
.report-table tr.total td.num { color: var(--accent); }

.report-note { margin-top: 10px; font-size: 12px; color: var(--text-faint); line-height: 1.55; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill-ok { background: var(--income-soft); color: var(--income); }
.pill-warn { background: var(--advisory-soft); color: var(--advisory); }
.pill-due { background: var(--expense-soft); color: var(--expense); }

.advisory-item { padding: 9px 10px; margin-top: 8px; border-radius: var(--radius-sm); background: var(--advisory-soft); font-size: 12.5px; color: var(--advisory); }
.advisory-item b { font-family: var(--font-mono); }

.mini-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 4px; }
.mini-stat { padding: 10px; border-radius: var(--radius-sm); background: var(--surface-2); }
.mini-stat .n { display: block; font-family: var(--font-mono); font-size: 17px; font-weight: 650; }
.mini-stat .l { font-size: 12px; color: var(--text-muted); }

/* ---------- 页脚与提示 ---------- */
.footer { padding-top: 24px; padding-bottom: 40px; color: var(--text-faint); font-size: 12px; text-align: center; }
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  background: var(--text); color: var(--bg);
  padding: 10px 18px; border-radius: 999px; font-size: 14px;
  box-shadow: var(--shadow); z-index: 50; max-width: calc(100vw - 40px);
}

/* ---------- 托管版专有：同步状态与复制面板 ---------- */
.sync-badge {
  font: inherit; font-size: 13px;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 13px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted);
  cursor: default;
}
.sync-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.sync-badge.is-ok { color: var(--income); }
.sync-badge.is-busy { color: var(--accent); }
.sync-badge.is-warn { color: var(--text-muted); }
.sync-badge.is-error { color: var(--expense); cursor: pointer; border-color: var(--expense); }
.sync-badge.is-error:hover { background: var(--expense-soft); }
.sync-badge.is-busy::before { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }

.copy-panel {
  position: fixed; inset: auto 16px 16px 16px; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px; padding: 16px;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius); box-shadow: var(--shadow); z-index: 60;
}
.copy-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.copy-panel textarea {
  width: 100%; height: 180px; resize: vertical;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.5; padding: 10px;
  border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
}

/* ---------- 响应式 ---------- */
@media (max-width: 900px) {
  .columns { grid-template-columns: minmax(0, 1fr); }
  .field-row, .field-row-3 { grid-template-columns: minmax(0, 1fr); }
  .form-card .field-row + .field-row { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 560px) {
  .topbar-inner { height: auto; padding: 12px 0; flex-direction: column; align-items: stretch; }
  .stats { grid-template-columns: minmax(0, 1fr); }
  .record-actions { opacity: 1; }
  .stat-value { font-size: 19px; }
  .mini-stats { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .sync-badge.is-busy::before { animation: none; }
}

</style>

<template id="app-shell">
<header class="topbar">
  <div class="wrap topbar-inner">
    <h1 class="brand"><span aria-hidden="true">📒</span> 记账报税助手</h1>
    <div class="topbar-actions">
      <button type="button" class="btn btn-ghost" id="export-csv">导出 CSV</button>
      <button type="button" class="btn btn-ghost" id="import-csv">导入 CSV</button>
      <input type="file" id="file-input" accept=".csv,text/csv" hidden>
      <button type="button" class="btn btn-ghost btn-danger" id="clear-all">清空</button>
    </div>
  </div>
</header>

<div class="compliance-banner">
  <div class="wrap">
    <strong>这是记账与税额测算工具，不是官方申报系统。</strong>
    税率、起征点、扣除比例等参数均为可编辑的示例值，请核实最新政策后调整；
    正式申报前请以电子税务局或税务师确认的数字为准。
  </div>
</div>

<p class="banner banner-warn" id="storage-warning" hidden>
  浏览器不允许本站保存数据（隐私模式或站点数据被禁用），这次录入的内容关掉页面就会丢失。
</p>

<main class="wrap">

  <section class="card settings-card">
    <button type="button" class="card-head settings-toggle" id="settings-toggle" aria-expanded="false" aria-controls="settings-body">
      <h2 class="card-title">纳税人与税务参数</h2>
      <span class="settings-summary" id="settings-summary"></span>
      <span class="chevron" aria-hidden="true">›</span>
    </button>

    <div id="settings-body" class="settings-body" hidden>
      <p class="notice">以下数值为示例，不代表当前有效政策，请核实后修改。</p>

      <div class="field-row">
        <div class="field">
          <label>纳税人类型</label>
          <div class="segmented" role="radiogroup" aria-label="纳税人类型">
            <label class="segment"><input type="radio" name="taxpayerType" value="small" checked><span>小规模纳税人</span></label>
            <label class="segment"><input type="radio" name="taxpayerType" value="general"><span>一般纳税人</span></label>
          </div>
        </div>
        <div class="field">
          <label>申报周期</label>
          <div class="segmented" role="radiogroup" aria-label="申报周期">
            <label class="segment"><input type="radio" name="period" value="month" checked><span>按月</span></label>
            <label class="segment"><input type="radio" name="period" value="quarter"><span>按季</span></label>
          </div>
        </div>
      </div>

      <div class="field-row" id="settings-small-fields">
        <div class="field">
          <label for="s-vat-small-rate">增值税征收率 (%)</label>
          <input type="text" id="s-vat-small-rate" inputmode="decimal">
          <p class="error" id="s-vat-small-rate-error" role="alert"></p>
        </div>
        <div class="field">
          <label for="s-vat-threshold-month">月销售额起征点 (元)</label>
          <input type="text" id="s-vat-threshold-month" inputmode="decimal">
          <p class="error" id="s-vat-threshold-month-error" role="alert"></p>
        </div>
        <div class="field">
          <label for="s-vat-threshold-quarter">季度销售额起征点 (元)</label>
          <input type="text" id="s-vat-threshold-quarter" inputmode="decimal">
          <p class="error" id="s-vat-threshold-quarter-error" role="alert"></p>
        </div>
      </div>

        if (f.invoiceType && f.invoiceType !== 'all' && r.invoiceType !== f.invoiceType) return false;
        if (keyword) {
          var hay = (r.category + ' ' + r.counterparty + ' ' + (r.note || '') + ' ' + (r.invoiceNo || '')).toLowerCase();
          if (hay.indexOf(keyword) === -1) return false;
        }
        return true;
      })
      .sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return (b.createdAt || 0) - (a.createdAt || 0);
      });
  }

  /** 记录里出现过的period（月或季度）key，倒序。 */
  function availablePeriods(records, periodType) {
    var seen = {};
    (records || []).forEach(function (r) { seen[periodKeyOf(r.date, periodType)] = true; });
    return Object.keys(seen).sort().reverse();
  }

  // ---------- 增值税测算 ----------

  /** 小规模纳税人：不含税销售额 × 征收率；未达起征点则免征。 */
  function vatSmallScale(records, settings, periodKey, periodType) {
    var incomeRecords = (records || []).filter(function (r) {
      return r.direction === 'income' && periodKeyOf(r.date, periodType) === periodKey;
    });
    var netSales = incomeRecords.reduce(function (sum, r) { return sum + r.netAmount; }, 0);
    var threshold = periodType === 'quarter'
      ? settings.vatSmallThresholdQuarter
      : settings.vatSmallThresholdMonth;
    var belowThreshold = netSales < threshold;
    var payable = belowThreshold ? 0 : Math.round(netSales * settings.vatSmallRate / 100);
    return {
      taxpayerType: 'small',
      netSales: netSales,
      rate: settings.vatSmallRate,
      threshold: threshold,
      belowThreshold: belowThreshold,
      payable: payable
    };
  }

  /**
   * 一般纳税人：销项税额 - 可抵扣进项税额（含期初留抵），
   * 差额为负则本期不缴税，结余部分结转为下期期初留抵。
   */
  function vatGeneralScale(records, settings, periodKey, periodType) {
    var periodRecords = (records || []).filter(function (r) {
      return periodKeyOf(r.date, periodType) === periodKey;
    });
    var outputTax = periodRecords
      .filter(function (r) { return r.direction === 'income'; })
      .reduce(function (sum, r) { return sum + r.taxAmount; }, 0);
    var inputTax = periodRecords
      .filter(function (r) { return r.direction === 'expense' && r.deductible; })
      .reduce(function (sum, r) { return sum + r.taxAmount; }, 0);

    var openingCredit = settings.vatOpeningCredit || 0;
    var availableCredit = openingCredit + inputTax;
    var payable = Math.max(0, outputTax - availableCredit);
    var closingCredit = Math.max(0, availableCredit - outputTax);

    return {
      taxpayerType: 'general',
      outputTax: outputTax,
      inputTax: inputTax,
      openingCredit: openingCredit,
      availableCredit: availableCredit,
      payable: payable,
      closingCredit: closingCredit
    };
  }

  function vatCalc(records, settings, periodKey, periodType) {
    return settings.taxpayerType === 'general'
      ? vatGeneralScale(records, settings, periodKey, periodType)
      : vatSmallScale(records, settings, periodKey, periodType);
  }

  /** 附加税（城建税+教育费附加+地方教育费附加），以本期应纳增值税为计税基础。 */
  function surtaxCalc(vatPayable, settings) {
    var amount = Math.round(vatPayable * (settings.surtaxRate || 0) / 100);
    return { base: vatPayable, rate: settings.surtaxRate || 0, amount: amount };
  }

  // ---------- 企业所得税测算 ----------

  /** 阶梯（分段）税率速算：每一档只对超过前一档上限的部分按该档税率计算。 */
  function bracketTax(amountCents, brackets) {
    var sorted = (brackets || []).slice().sort(function (a, b) {
      var ua = a.upTo == null ? Infinity : a.upTo;
      var ub = b.upTo == null ? Infinity : b.upTo;
      return ua - ub;
    });
    var lower = 0;
    var tax = 0;
    var detail = [];
    for (var i = 0; i < sorted.length; i++) {
      var upper = sorted[i].upTo == null ? Infinity : sorted[i].upTo;
      var portion = Math.max(0, Math.min(amountCents, upper) - lower);
      var portionTax = Math.round(portion * sorted[i].rate / 100);
      if (portion > 0) detail.push({ from: lower, to: Math.min(amountCents, upper), rate: sorted[i].rate, tax: portionTax });
      tax += portionTax;
      lower = upper;
      if (amountCents <= upper) break;
    }
    return { tax: tax, detail: detail };
  }

  /**
   * 企业所得税测算：利润（不含税收入 - 不含税成本费用）作为应纳税所得额的
   * 简化近似，未考虑任何纳税调整事项（如超标费用调增、免税收入调减等）——
   * 这类调整规则多且常变，测算只给一个未调整的参考数，实际申报以纳税调整
   * 后的数字为准。
   */
  function citCalc(records, settings) {
    var s = summarize(records);
    var taxableIncome = Math.max(0, s.profit); // 亏损年度应纳税所得额按 0 处理，不做以后年度弥补测算
    var result = bracketTax(taxableIncome, settings.citBrackets);
    return {
      revenue: s.incomeNet,
      costAndExpense: s.expenseNet,
      profit: s.profit,
      taxableIncome: taxableIncome,
      tax: result.tax,
      brackets: result.detail
    };
  }

  /**
   * 业务招待费 / 广告宣传费扣除限额——仅供参考，不改变企业所得税测算的
   * 应纳税所得额（真实申报需要走纳税调整表）。
   */
  function deductionAdvisory(records, settings) {
    var s = summarize(records);
    var revenue = s.incomeNet;
    var entertainment = groupByCategory(records, 'expense').find(function (g) { return g.category === '业务招待费'; });
    var ad = groupByCategory(records, 'expense').find(function (g) { return g.category === '广告宣传费'; });
    var advisories = [];

    if (entertainment && entertainment.total > 0) {
      var byRate = Math.round(entertainment.total * (settings.entertainmentDeductRate || 0) / 100);
      var byRevenue = Math.round(revenue * (settings.entertainmentRevenueCap || 0) / 100);
      var cap = Math.min(byRate, byRevenue);
      advisories.push({
        category: '业务招待费',
        spent: entertainment.total,
        cap: cap,
        excess: Math.max(0, entertainment.total - cap),
        rule: settings.entertainmentDeductRate + '% 与收入 ' + settings.entertainmentRevenueCap + '% 孰低'
      });
    }
    if (ad && ad.total > 0) {
      var adCap = Math.round(revenue * (settings.adRevenueCap || 0) / 100);
      advisories.push({
        category: '广告宣传费',
        spent: ad.total,
        cap: adCap,
        excess: Math.max(0, ad.total - adCap),
        rule: '收入的 ' + settings.adRevenueCap + '%'
      });
    }
    return advisories;
  }

  // ---------- 税务参数校验 ----------

  function parseNonNegativeAmount(input) {
    var cents = parseAmount(input);
    return cents !== null && cents >= 0 ? cents : null;
  }

  /**
   * 校验并规整税务参数面板的输入。企业所得税阶梯在界面上简化成两档
   * （低档上限 + 低档税率 + 高档税率），这里转成 citBrackets 数组。
   */
  function validateSettings(input) {
    var errors = {};
    var raw = input || {};

    if (TAXPAYER_TYPES.indexOf(raw.taxpayerType) === -1) errors.taxpayerType = '请选择纳税人类型';
    if (PERIOD_TYPES.indexOf(raw.period) === -1) errors.period = '请选择申报周期';

    var vatSmallRate = parseRate(raw.vatSmallRate);
    if (vatSmallRate === null) errors.vatSmallRate = '征收率应为 0~100 的数字';

    var vatThresholdMonth = parseNonNegativeAmount(raw.vatSmallThresholdMonth);
    if (vatThresholdMonth === null) errors.vatSmallThresholdMonth = '起征点金额不对';

    var vatThresholdQuarter = parseNonNegativeAmount(raw.vatSmallThresholdQuarter);
    if (vatThresholdQuarter === null) errors.vatSmallThresholdQuarter = '起征点金额不对';

    var vatOpeningCredit = parseNonNegativeAmount(raw.vatOpeningCredit == null || raw.vatOpeningCredit === '' ? 0 : raw.vatOpeningCredit);
    if (vatOpeningCredit === null) errors.vatOpeningCredit = '留抵税额不对';

    var surtaxRate = parseRate(raw.surtaxRate);
    if (surtaxRate === null) errors.surtaxRate = '附加税比例应为 0~100 的数字';

    var citCap = parseNonNegativeAmount(raw.citBracketCap);
    if (citCap === null) errors.citBracketCap = '分档上限金额不对';

    var citLowRate = parseRate(raw.citLowRate);
    if (citLowRate === null) errors.citLowRate = '税率应为 0~100 的数字';

    var citHighRate = parseRate(raw.citHighRate);
    if (citHighRate === null) errors.citHighRate = '税率应为 0~100 的数字';

    var entertainmentDeductRate = parseRate(raw.entertainmentDeductRate);
    if (entertainmentDeductRate === null) errors.entertainmentDeductRate = '比例应为 0~100 的数字';

    var entertainmentRevenueCap = parseRate(raw.entertainmentRevenueCap);
    if (entertainmentRevenueCap === null) errors.entertainmentRevenueCap = '比例应为 0~100 的数字';

    var adRevenueCap = parseRate(raw.adRevenueCap);
    if (adRevenueCap === null) errors.adRevenueCap = '比例应为 0~100 的数字';

    var ok = Object.keys(errors).length === 0;
    if (!ok) return { ok: false, errors: errors, value: null };

    return {
      ok: true,
      errors: {},
      value: {
        taxpayerType: raw.taxpayerType,
        period: raw.period,
        vatSmallRate: vatSmallRate,
        vatSmallThresholdMonth: vatThresholdMonth,
        vatSmallThresholdQuarter: vatThresholdQuarter,
        vatOpeningCredit: vatOpeningCredit,
        surtaxRate: surtaxRate,
        citBrackets: [
          { upTo: citCap, rate: citLowRate },
          { upTo: null, rate: citHighRate }
        ],
        entertainmentDeductRate: entertainmentDeductRate,
        entertainmentRevenueCap: entertainmentRevenueCap,
        adRevenueCap: adRevenueCap
      }
    };
  }

  /** 用示例值补全缺失字段，保证旧数据加载时不会因为少个字段就整体出错。 */
  function normalizeSettings(input) {
    var raw = input && typeof input === 'object' ? input : {};
    var merged = Object.assign({}, EXAMPLE_SETTINGS, raw);
    if (!Array.isArray(merged.citBrackets) || merged.citBrackets.length === 0) {
      merged.citBrackets = EXAMPLE_SETTINGS.citBrackets;
    }
    return merged;
  }

  // ---------- CSV ----------

  var CSV_HEADER = ['日期', '方向', '科目', '往来单位', '价税合计', '税率(%)', '发票类型', '发票号', '备注'];

  function escapeCSVField(value) {
    var text = String(value == null ? '' : value);
    if (/[",\n\r]/.test(text)) return '"' + text.replace(/"/g, '""') + '"';
    return text;
  }

  var INVOICE_LABEL = { none: '无票', general: '普通发票', special: '增值税专用发票' };
  var INVOICE_LABEL_REVERSE = { '无票': 'none', '普通发票': 'general', '增值税专用发票': 'special', general: 'general', special: 'special', none: 'none' };

  function toCSV(records) {
    var lines = [CSV_HEADER.join(',')];
    (records || []).forEach(function (r) {
      lines.push([
        escapeCSVField(r.date),
        escapeCSVField(r.direction === 'income' ? '收入' : '支出'),
        escapeCSVField(r.category),
        escapeCSVField(r.counterparty || ''),
        escapeCSVField(formatAmount(r.grossAmount).replace(/,/g, '')),
        escapeCSVField(r.taxRate),
        escapeCSVField(INVOICE_LABEL[r.invoiceType] || '无票'),
        escapeCSVField(r.invoiceNo || ''),
        escapeCSVField(r.note || '')
      ].join(','));
    });
    return lines.join('\r\n');
  }

  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var source = String(text).replace(/^﻿/, '');

    for (var i = 0; i < source.length; i++) {
      var ch = source[i];
      if (inQuotes) {
        if (ch === '"') {
          if (source[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += ch;
        continue;
      }
      if (ch === '"') { inQuotes = true; continue; }
      if (ch === ',') { row.push(field); field = ''; continue; }
      if (ch === '\r') continue;
      if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; continue; }
      field += ch;
    }
    row.push(field);
    rows.push(row);
    return rows.filter(function (r) { return r.length > 1 || r[0].trim() !== ''; });
  }

  function fromCSV(text, settings, now) {
    var rows = parseCSV(text);
    var records = [];
    var errors = [];
    if (rows.length === 0) return { records: records, errors: errors };

    var start = rows[0][0] && rows[0][0].trim() === CSV_HEADER[0] ? 1 : 0;
    for (var i = start; i < rows.length; i++) {
      var cells = rows[i];
      var lineNo = i + 1;
      if (cells.length < 6) {
        errors.push({ line: lineNo, message: '列数不足，至少需要 日期,方向,科目,往来单位,价税合计,税率' });
        continue;
      }
      var directionText = (cells[1] || '').trim();
      var direction = directionText === '收入' || directionText === 'income'
        ? 'income'
        : (directionText === '支出' || directionText === 'expense' ? 'expense' : '');
      var invoiceTypeRaw = (cells[6] || '无票').trim();
      var invoiceType = INVOICE_LABEL_REVERSE[invoiceTypeRaw] || 'none';

      var result = createTransaction({
        direction: direction,
        date: (cells[0] || '').trim(),
        category: cells[2],
        counterparty: cells[3] || '',
        grossAmount: cells[4],
        taxRate: cells[5],
        invoiceType: invoiceType,
        invoiceNo: cells[7] || '',
        note: cells[8] || ''
      }, settings, now ? now + i : undefined);

      if (!result.ok) {
        var first = Object.keys(result.errors)[0];
        errors.push({ line: lineNo, message: result.errors[first] });
        continue;
      }
      records.push(result.value);
    }
    return { records: records, errors: errors };
  }

  function mergeRecords(existing, incoming) {
    var seen = {};
    var out = [];
    (existing || []).concat(incoming || []).forEach(function (r) {
      if (seen[r.id]) return;
      seen[r.id] = true;
      out.push(r);
    });
    return out;
  }

  return {
    DIRECTIONS: DIRECTIONS,
    INVOICE_TYPES: INVOICE_TYPES,
    TAXPAYER_TYPES: TAXPAYER_TYPES,
    PERIOD_TYPES: PERIOD_TYPES,
    DEFAULT_CATEGORIES: DEFAULT_CATEGORIES,
    COMMON_RATES: COMMON_RATES,
    EXAMPLE_SETTINGS: EXAMPLE_SETTINGS,
    CSV_HEADER: CSV_HEADER,
    INVOICE_LABEL: INVOICE_LABEL,

    parseAmount: parseAmount,
    formatAmount: formatAmount,
    parseRate: parseRate,
    splitTax: splitTax,

    todayString: todayString,
    isValidDate: isValidDate,
    monthOf: monthOf,
    quarterOf: quarterOf,
    periodKeyOf: periodKeyOf,
    quarterMonths: quarterMonths,

    isDeductible: isDeductible,
    validateTransaction: validateTransaction,
    createTransaction: createTransaction,
    validateSettings: validateSettings,
    normalizeSettings: normalizeSettings,

    summarize: summarize,
    groupByCategory: groupByCategory,
    filterRecords: filterRecords,
    availablePeriods: availablePeriods,

    vatSmallScale: vatSmallScale,
    vatGeneralScale: vatGeneralScale,
    vatCalc: vatCalc,
    surtaxCalc: surtaxCalc,
    bracketTax: bracketTax,
    citCalc: citCalc,
    deductionAdvisory: deductionAdvisory,

    toCSV: toCSV,
    parseCSV: parseCSV,
    fromCSV: fromCSV,
    mergeRecords: mergeRecords
  };
});

/**
 * 托管版存储层：数据（记账记录 + 税务参数）存回 artifact 自己的新版本，
 * 因此手机和电脑打开同一个链接看到的是同一份账。接口与 storage.js 完全
 * 一致（loadRecords/saveRecords/loadSettings/saveSettings/...），app.js
 * 不需要知道两版的差别。
 *
 * 三件事值得先说清楚：
 *
 * 1. publish 是「最后一个动作」——发布成功后所有打开的视图（包括当前这个）
 *    都会重新加载。所以发布前必须把用户正在填的表单存进 sessionStorage，
 *    重载后再放回去，否则手一快就会丢掉正在录入的那一笔。
 *
 * 2. 发布的文档必须自己重新拼出来，不能序列化当前 DOM（已经被渲染改过）。
 *    页面因此把自己的源码放在三个只读的孤岛里：#app-css、#app-shell、
 *    #app-js，渲染只动 #app，这几个孤岛从头到尾没人碰，可以安全读回来
 *    重新拼装。
 *
 * 3. localStorage 仍然写一份镜像。它不是数据源，是发布失败时的安全网：
 *    下次启动时把镜像里存在、但已发布版本里没有的记录并回去，免得丢账。
 */
window.LedgerStore = (function () {
  'use strict';

  var MIRROR_KEY = 'biz-ledger.mirror.v1';
  var PREF_KEY = 'biz-ledger.prefs.v1';
  var DRAFT_KEY = 'biz-ledger.draft.v1';
  var PUBLISH_DELAY = 900;

  var state = {
    records: [],
    settings: window.Ledger.normalizeSettings(null),
    api: null,
    downloads: null,
    mode: 'connecting',
    timer: null,
    publishing: false,
    awaitingReload: false,
    retried: false,
    rescuedCount: 0
  };

  // ---------- 安全的 localStorage ----------

  function readRaw(key) { try { return window.localStorage.getItem(key); } catch (err) { return null; } }
  function writeRaw(key, value) { try { window.localStorage.setItem(key, value); return true; } catch (err) { return false; } }

  function readJSON(key, fallback) {
    var raw = readRaw(key);
    if (!raw) return fallback;
    try {
      var parsed = JSON.parse(raw);
      return parsed == null ? fallback : parsed;
    } catch (err) { return fallback; }
  }

  // ---------- 状态徽章 ----------

  var badge = null;

  function ensureBadge() {
    if (badge) return badge;
    var host = document.querySelector('.topbar-actions');
    if (!host) return null;
    badge = document.createElement('button');
    badge.type = 'button';
    badge.className = 'sync-badge';
    badge.addEventListener('click', function () {
      if (state.mode === 'synced' && !state.publishing) schedulePublish(0);
    });
    host.insertBefore(badge, host.firstChild);
    return badge;
  }

  var LABELS = {
    connecting: ['连接中…', 'is-idle'],
    synced: ['已同步', 'is-ok'],
    saving: ['保存中…', 'is-busy'],
    local: ['仅存本机', 'is-warn'],
    readonly: ['只读', 'is-warn'],
    error: ['未保存，点击重试', 'is-error']
  };

  function setStatus(key, title) {
    var node = ensureBadge();
    if (!node) return;
    var label = LABELS[key] || LABELS.connecting;
    node.textContent = label[0];
    node.className = 'sync-badge ' + label[1];
    node.title = title || '';
    node.disabled = key !== 'error';
  }

  // ---------- 把页面自己拼回去 ----------

  function jsonForScript(value) {
    // 用户备注/往来单位里可能写出脚本结束标签或注释开头，转义掉才不会截断内联脚本
    return JSON.stringify(value)
      .replace(/</g, '\\u003c')
      .replace(/>/g, '\\u003e')
      .replace(/\u2028/g, '\\u2028')
      .replace(/\u2029/g, '\\u2029');
  }

  function sourceOf(id) {
    var node = document.getElementById(id);
    return node ? node.textContent : '';
  }

  function renderDocument(records, settings) {
    var shell = document.getElementById('app-shell');
    var close = '<\/script>';
    return [
      '<!doctype html>',
      '<html lang="zh-CN">',
      '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<title>记账报税助手<\/title>',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">',
      '<style id="app-css">' + sourceOf('app-css') + '<\/style>',
      '</head>',
      '<body>',
      '<template id="app-shell">' + (shell ? shell.innerHTML : '') + '<\/template>',
      '<div id="app"></div>',
      '<script type="application/json" id="app-data">' +
        jsonForScript({ version: 1, records: records, settings: settings, savedAt: Date.now() }) + close,
      '<script id="app-js">' + sourceOf('app-js') + close,
      '</body>',
      '</html>'
    ].join('\n');
  }

  // ---------- 正在填的内容：发布前存好，重载后放回 ----------

  function stashDraft() {
    try {
      var directionInput = document.querySelector('input[name="direction"]:checked');
      var invoiceChip = document.querySelector('#invoice-chips .chip[aria-pressed="true"]');
      window.sessionStorage.setItem(DRAFT_KEY, JSON.stringify({
        direction: directionInput ? directionInput.value : 'expense',
        grossAmount: (document.getElementById('grossAmount') || {}).value || '',
        taxRate: (document.getElementById('taxRate') || {}).value || '',
        invoiceType: invoiceChip ? invoiceChip.dataset.invoiceType : 'none',
        category: (document.getElementById('category') || {}).value || '',
        counterparty: (document.getElementById('counterparty') || {}).value || '',
        invoiceNo: (document.getElementById('invoiceNo') || {}).value || '',
        note: (document.getElementById('note') || {}).value || '',
        date: (document.getElementById('date') || {}).value || '',
        editingId: (document.getElementById('record-id') || {}).value || '',
        keyword: (document.getElementById('filter-keyword') || {}).value || '',
        scrollY: window.scrollY
      }));
    } catch (err) { /* sessionStorage 不可用就算了，不能因此挡住保存 */ }
  }

  function restoreDraft() {
    var draft;
    try {
      var raw = window.sessionStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      window.sessionStorage.removeItem(DRAFT_KEY);
      draft = JSON.parse(raw);
    } catch (err) { return; }
    if (!draft) return;

    var setValue = function (id, value) {
      var node = document.getElementById(id);
      if (node && value) node.value = value;
    };
    var directionInput = document.querySelector('input[name="direction"][value="' + draft.direction + '"]');
    if (directionInput) {
      directionInput.checked = true;
      directionInput.dispatchEvent(new Event('change', { bubbles: true }));
    }
    setValue('grossAmount', draft.grossAmount);
    setValue('taxRate', draft.taxRate);
    setValue('category', draft.category);
    setValue('counterparty', draft.counterparty);
    setValue('invoiceNo', draft.invoiceNo);
    setValue('note', draft.note);
    setValue('date', draft.date);

    if (draft.invoiceType) {
      var chip = document.querySelector('#invoice-chips .chip[data-invoice-type="' + draft.invoiceType + '"]');
      if (chip) chip.click();
    }
    // 手动触发一次预览刷新（grossAmount/taxRate 的 input 事件监听器会做这件事）
    var grossInput = document.getElementById('grossAmount');
    if (grossInput) grossInput.dispatchEvent(new Event('input', { bubbles: true }));

    if (draft.keyword) {
      setValue('filter-keyword', draft.keyword);
      document.getElementById('filter-keyword').dispatchEvent(new Event('input', { bubbles: true }));
    }
    if (draft.scrollY) window.scrollTo(0, draft.scrollY);
  }

  // ---------- 发布 ----------

  function schedulePublish(delay) {
    if (!state.api || state.awaitingReload) return;
    window.clearTimeout(state.timer);
    state.timer = window.setTimeout(publishNow, delay == null ? PUBLISH_DELAY : delay);
  }

  function publishNow() {
    if (!state.api || state.publishing || state.awaitingReload) return;
    state.publishing = true;
    setStatus('saving');
    stashDraft();

    state.api.publish(renderDocument(state.records, state.settings)).then(function () {
      state.awaitingReload = true;
      state.publishing = false;
      setStatus('synced');
      window.setTimeout(function () {
        if (state.awaitingReload) window.location.reload();
      }, 3000);
    }).catch(function (err) {
      state.publishing = false;
      var code = err && err.code;

      if (code === 'conflict') {
        state.awaitingReload = true;
        setStatus('saving', '另一台设备刚保存过，正在取回最新的账');
        return;
      }
      if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared') {
        state.api = null;
        state.mode = 'readonly';
        setStatus('readonly', '这个链接对你是只读的，改动只留在本机');
        return;
      }
      if (code === 'rate_limited' && !state.retried) {
        state.retried = true;
        setStatus('saving', '保存太频繁，稍后自动重试');
        schedulePublish(4000);
        return;
      }
      setStatus('error', '保存到云端失败，数据还在本机。点一下重试');
    });
  }

  // ---------- 对外接口（与 storage.js 一致） ----------

  function readPublished() {
    var node = document.getElementById('app-data');
    if (!node) return { records: [], settings: null };
    try {
      var parsed = JSON.parse(node.textContent || '{}');
      return {
        records: Array.isArray(parsed.records) ? parsed.records : [],
        settings: parsed.settings || null
      };
    } catch (err) { return { records: [], settings: null }; }
  }

  var publishedCache = null;
  function published() {
    if (!publishedCache) publishedCache = readPublished();
    return publishedCache;
  }

  function loadRecords() {
    var list = published().records.filter(function (r) {
      return r && typeof r.id === 'string' && typeof r.grossAmount === 'number' && r.date;
    });

    var mirror = readJSON(MIRROR_KEY, null);
    var rescued = [];
    if (mirror && Array.isArray(mirror.records)) {
      var known = {};
      list.forEach(function (r) { known[r.id] = true; });
      rescued = mirror.records.filter(function (r) { return r && typeof r.id === 'string' && !known[r.id]; });
    }

    state.records = rescued.length ? window.Ledger.mergeRecords(list, rescued) : list;
    if (rescued.length) state.rescuedCount = rescued.length;
    return state.records;
  }

  function loadSettings() {
    state.settings = window.Ledger.normalizeSettings(published().settings);
    return state.settings;
  }

  function saveRecords(records) {
    state.records = records;
    writeRaw(MIRROR_KEY, JSON.stringify({ version: 1, records: records, savedAt: Date.now() }));
    if (state.api) schedulePublish();
    return true;
  }

  function saveSettings(settings) {
    state.settings = settings;
    if (state.api) schedulePublish();
    return true;
  }

  function loadPrefs() { return readJSON(PREF_KEY, {}); }
  function savePrefs(prefs) { return writeRaw(PREF_KEY, JSON.stringify(prefs)); }
  function isAvailable() { return true; }

  /** 导出：查看器里页面自己发起的下载会被沙箱拦掉，走 downloads 能力。 */
  function download(filename, text, done) {
    var content = '﻿' + text;
    if (!state.downloads) {
      showCopyPanel(filename, text);
      if (done) done('这个环境不能直接下载，已把 CSV 放出来供复制');
      return;
    }
    state.downloads.save({ filename: filename, data: content }).then(function () {
      if (done) done();
    }).catch(function (err) {
      var code = err && err.code;
      if (code === 'declined') { if (done) done('已取消导出'); return; }
      showCopyPanel(filename, text);
      if (done) done('下载没成功，已把 CSV 放出来供复制');
    });
  }

  function showCopyPanel(filename, text) {
    var old = document.getElementById('copy-panel');
    if (old) old.remove();

    var panel = document.createElement('div');
    panel.className = 'copy-panel';
    panel.id = 'copy-panel';

    var head = document.createElement('div');
    head.className = 'copy-panel-head';
    var title = document.createElement('strong');
    title.textContent = filename;
    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'icon-btn';
    close.textContent = '关闭';
    close.addEventListener('click', function () { panel.remove(); });
    head.appendChild(title);
    head.appendChild(close);

    var area = document.createElement('textarea');
    area.readOnly = true;
    area.value = text;
    area.setAttribute('aria-label', 'CSV 内容，可全选复制');

    var copy = document.createElement('button');
    copy.type = 'button';
    copy.className = 'btn btn-primary';
    copy.textContent = '复制全部';
    copy.addEventListener('click', function () {
      area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      copy.textContent = ok ? '已复制' : '请手动按 Ctrl/⌘+C';
    });

    panel.appendChild(head);
    panel.appendChild(area);
    panel.appendChild(copy);
    document.body.appendChild(panel);
    area.focus();
    area.select();
  }

  // ---------- 启动时接上能力 ----------

  function connect() {
    var claude = window.claude;
    if (!claude || typeof claude.use !== 'function') {
      state.mode = 'local';
      setStatus('local', '当前环境不提供云端保存，数据只留在这台设备');
      return;
    }
    setStatus('connecting');

    claude.use('artifact').then(function (api) {
      if (!api) {
        state.mode = 'local';
        setStatus('local', '这个视图不能写入，数据只留在这台设备');
        return;
      }
      state.api = api;
      state.mode = 'synced';
      setStatus('synced', '手机和电脑打开同一个链接，看到的是同一份账');
      if (state.rescuedCount) schedulePublish(0);
    }).catch(function () {
      state.mode = 'local';
      setStatus('local', '连接云端失败，数据只留在这台设备');
    });

    claude.use('downloads').then(function (api) { state.downloads = api || null; }).catch(function () { state.downloads = null; });
  }

  window.LedgerHosted = { restoreDraft: restoreDraft, connect: connect, renderDocument: renderDocument };

  return {
    loadRecords: loadRecords,
    saveRecords: saveRecords,
    loadSettings: loadSettings,
    saveSettings: saveSettings,
    loadPrefs: loadPrefs,
    savePrefs: savePrefs,
    isAvailable: isAvailable,
    download: download
  };
})();


/* ---- 启动顺序 ---- */
(function () {

  var tpl = document.getElementById('app-shell');

/**

 */
(function () {
  'use strict';

  var L = window.Ledger;
  var Store = window.LedgerStore;

  var $ = function (id) { return document.getElementById(id); };

  var state = {
    records: [],
    settings: L.normalizeSettings(null),
    editingId: null,
    filters: { period: 'all', direction: 'all', category: 'all', invoiceType: 'all', keyword: '' },

    category: $('category'),
    counterparty: $('counterparty'),
    invoiceNo: $('invoiceNo'),
    note: $('note'),
    taxPreview: $('tax-preview'),
    submitBtn: $('submit-btn'),
    cancelEdit: $('cancel-edit'),
    categoryChips: $('category-chips'),
    datalist: $('category-options'),
    list: $('record-list'),

    filterKeyword: $('filter-keyword'),
    vatPeriodSelect: $('vat-period'),
    vatReport: $('vat-report'),
    surtaxReport: $('surtax-report'),
    citYearSelect: $('cit-year'),
    citReport: $('cit-report'),
    invoiceReport: $('invoice-report'),
    settingsToggle: $('settings-toggle'),
