<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D4A8A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151B" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>课程排程台</title>
<style>:root{color-scheme:light dark}html{-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
  :root {
    --ground:   #F2F4F7;
    --panel:    #FFFFFF;
    --sunken:   #E8EBF0;
    --line:     #D6DBE4;
    --line-soft:#E4E8EE;
    --ink:      #171B24;
    --ink-mid:  #4B5567;
    --ink-dim:  #7A8497;
    --accent:   #2D4A8A;
    --accent-in:#FFFFFF;
    --accent-wash:#E5EAF6;
    --good:     #1F6B4F;
    --good-wash:#E0F0E8;
    --warn:     #A9502A;
    --warn-wash:#F7E9E0;

    --c1: #2D4A8A; --c2: #1F6B4F; --c3: #8A4A2D;
    --c4: #6B3F7A; --c5: #1F5F6B; --c6: #8A2D4A;

    --face: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "PingFang SC", "SFMono-Regular", Menlo, monospace;

    --r: 3px;
    --hour-h: 46px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:   #12151B;
      --panel:    #1A1E26;
      --sunken:   #22262F;
      --line:     #2F3540;
      --line-soft:#262B34;
      --ink:      #E7EAF0;
      --ink-mid:  #A8B0BF;
      --ink-dim:  #78808F;
      --accent:   #7A9BE0;
      --accent-in:#12151B;
      --accent-wash:#1E2735;
      --good:     #5CC49B;
      --good-wash:#152B23;
      --warn:     #E09468;
      --warn-wash:#2B1F17;

      --c1: #7A9BE0; --c2: #5CC49B; --c3: #D9925F;
      --c4: #B78ED0; --c5: #5FB6C4; --c6: #E0819C;
    }
  }
  :root[data-theme="dark"] {
    --ground:   #12151B;
    --panel:    #1A1E26;
    --sunken:   #22262F;
    --line:     #2F3540;
    --line-soft:#262B34;
    --ink:      #E7EAF0;
    --ink-mid:  #A8B0BF;
    --ink-dim:  #78808F;
    --accent:   #7A9BE0;
    --accent-in:#12151B;
    --accent-wash:#1E2735;
    --good:     #5CC49B;
    --good-wash:#152B23;
    --warn:     #E09468;
    --warn-wash:#2B1F17;

    --c1: #7A9BE0; --c2: #5CC49B; --c3: #D9925F;
    --c4: #B78ED0; --c5: #5FB6C4; --c6: #E0819C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--face);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */

  .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: .01em; margin-right: 4px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; }
  .stat { display: flex; align-items: baseline; gap: 6px; }
  .stat b { font-family: var(--mono); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11.5px; color: var(--ink-dim); letter-spacing: .06em; }
  .top-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 7px 13px;
    border-radius: var(--r);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--sunken); border-color: var(--ink-dim); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-in); font-weight: 500; }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); filter: brightness(1.1); }
  .btn-sm { padding: 4px 9px; font-size: 12.5px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  .sync-note { font-size: 11.5px; color: var(--ink-dim); font-family: var(--mono); }

  .wrap {
    display: grid;
    grid-template-columns: 316px minmax(0, 1fr);
    gap: 16px;
    padding: 16px 20px 40px;
    max-width: 1560px;
    margin-inline: auto;
    align-items: start;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
  }
  .card-hd {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line-soft);
  }
  .card-hd h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  .card-hd .count { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); margin-left: auto; }
  .card-bd { padding: 14px; }

  .rail { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 74px; }

  /* ---------- import ---------- */

  textarea.import {
    width: 100%; min-height: 92px; resize: vertical;
    background: var(--sunken); border: 1px solid var(--line);
    border-radius: var(--r); padding: 9px 10px;
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
  }
  textarea.import::placeholder { color: var(--ink-dim); }
  .hint { font-size: 11.5px; color: var(--ink-dim); line-height: 1.65; margin: 8px 0 0; }
  .hint code { font-family: var(--mono); font-size: 11px; background: var(--sunken); padding: 1px 4px; border-radius: 2px; }
  .import-row { display: flex; gap: 8px; margin-top: 9px; }

  /* ---------- course list ---------- */

  .courses { display: flex; flex-direction: column; }
  .course {
    display: grid;
    grid-template-columns: 3px 1fr auto;
    gap: 0 10px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line-soft);
    align-items: center;
  }
  .course:last-child { border-bottom: 0; }
  .swatch { grid-column: 1; grid-row: 1 / span 2; align-self: stretch; border-radius: 2px; background: var(--cc); }
  .course-name { grid-column: 2; grid-row: 1; font-weight: 500; overflow-wrap: anywhere; }
  .course-meta { grid-column: 2; grid-row: 2; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-dim); }
  .plat { font-family: var(--mono); letter-spacing: .04em; }
  .course-act { grid-column: 3; grid-row: 1 / span 2; display: flex; gap: 4px; align-items: center; }
  .icon-btn {
    border: 1px solid transparent; background: none; color: var(--ink-dim);
    cursor: pointer; padding: 3px 6px; border-radius: var(--r); font-size: 12px;
  }
  .icon-btn:hover { background: var(--sunken); color: var(--ink); }

  .bar { height: 3px; background: var(--sunken); border-radius: 2px; overflow: hidden; flex: 1; min-width: 40px; }
  .bar i { display: block; height: 100%; background: var(--cc); }

  .empty { padding: 22px 14px; text-align: center; color: var(--ink-dim); font-size: 12.5px; line-height: 1.8; }

  /* ---------- today ---------- */

  .today-list { display: flex; flex-direction: column; }
  .today-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
  }
  .today-item:last-child { border-bottom: 0; }
  .today-item.is-done .t-name { color: var(--ink-dim); text-decoration: line-through; }
  .t-time { font-family: var(--mono); font-size: 12px; color: var(--ink-mid); white-space: nowrap; }
  .t-name { flex: 1; overflow-wrap: anywhere; }
  .t-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--cc); flex: none; }
  input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex: none; }

  /* ---------- week grid ---------- */

  .grid-hd {
    display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr));
    border-bottom: 1px solid var(--line);
    position: sticky; top: 60px; background: var(--panel); z-index: 10;
  }
  .grid-hd div {
    padding: 8px 6px; text-align: center; font-size: 12px;
    border-left: 1px solid var(--line-soft);
  }
  .grid-hd div:first-child { border-left: 0; }
  .grid-hd .is-today { color: var(--accent); font-weight: 600; background: var(--accent-wash); }
  .grid-hd em { display: block; font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); }
  .grid-hd .is-today em { color: var(--accent); }

  .grid-bd { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); }
  .hours { position: relative; }
  .hours span {
    position: absolute; right: 7px; transform: translateY(-50%);
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim);
  }
  .day {
    position: relative; border-left: 1px solid var(--line-soft); cursor: crosshair;
    background-image: repeating-linear-gradient(180deg, var(--line-soft) 0 1px, transparent 1px var(--hour-h));
  }
  .day.is-today { background-color: var(--accent-wash); }

  .blk {
    position: absolute; left: 3px; right: 3px;
    border-radius: var(--r);
    border-left: 3px solid var(--cc);
    background: var(--panel);
    box-shadow: 0 1px 2px rgba(23, 27, 36, .1);
    padding: 4px 6px;
    font-size: 11.5px; line-height: 1.35;
    overflow: hidden; cursor: pointer;
    transition: box-shadow .15s, transform .15s;
  }
  .blk:hover { box-shadow: 0 3px 10px rgba(23, 27, 36, .18); transform: translateY(-1px); z-index: 5; }
  .blk b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blk .blk-time { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); }
  .blk.is-done { background: var(--good-wash); }
  .blk.is-done b { color: var(--ink-dim); text-decoration: line-through; }

  /* ---------- dialog ---------- */

  dialog {
    border: 1px solid var(--line); border-radius: var(--r);
    background: var(--panel); color: var(--ink);
    padding: 0; width: min(430px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(10, 12, 16, .5); }
  .dlg-hd { padding: 13px 16px; border-bottom: 1px solid var(--line-soft); font-weight: 600; font-size: 14px; }
  .dlg-bd { padding: 16px; display: flex; flex-direction: column; gap: 13px; }
  .dlg-ft { padding: 12px 16px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; align-items: center; }
  .dlg-ft .spacer { margin-left: auto; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > label { font-size: 11.5px; color: var(--ink-mid); letter-spacing: .04em; }
  .field input, .field select {
    background: var(--sunken); border: 1px solid var(--line);
    border-radius: var(--r); padding: 7px 9px; width: 100%;
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .err { color: var(--warn); font-size: 12px; min-height: 0; }

  .swatches { display: flex; gap: 6px; }
  .swatches button {
    width: 22px; height: 22px; border-radius: var(--r); border: 2px solid transparent;
    cursor: pointer; background: var(--sw);
  }
  .swatches button[aria-pressed="true"] { border-color: var(--ink); }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--ink); color: var(--ground);
    padding: 9px 16px; border-radius: var(--r); font-size: 13px;
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }


  /* ---------- view tabs ---------- */
  .tabs { display: flex; gap: 2px; background: var(--sunken); padding: 2px; border-radius: var(--r); }
  .tab {
    border: 0; background: none; color: var(--ink-mid);
    padding: 5px 14px; border-radius: 2px; cursor: pointer; font-size: 12.5px;
  }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(23,27,36,.12); }

  /* ---------- month ---------- */
  .month-hd { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line-soft); }
  .month-hd .mtitle { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .month-hd .spacer { margin-left: auto; }
  .month-dow { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); border-bottom: 1px solid var(--line); }
  .month-dow div { padding: 6px 4px; text-align: center; font-size: 11.5px; color: var(--ink-dim); }
  .month { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); }
  .mcell {
    min-height: 86px; padding: 5px 5px 6px;
    border: 0;
    border-left: 1px solid var(--line-soft); border-top: 1px solid var(--line-soft);
    display: flex; flex-direction: column; gap: 3px;
    cursor: pointer; background: none; text-align: left; font: inherit; color: inherit;
  }
  .mcell:nth-child(7n+1) { border-left: 0; }
  .mcell:hover { background: var(--sunken); }
  .mcell.is-out { opacity: .38; }
  .mcell.is-today { background: var(--accent-wash); }
  .mdate { font-family: var(--mono); font-size: 11.5px; color: var(--ink-mid); font-variant-numeric: tabular-nums; }
  .mcell.is-today .mdate { color: var(--accent); font-weight: 600; }
  .mchip {
    font-size: 10.5px; line-height: 1.5; padding: 1px 4px; border-radius: 2px;
    border-left: 3px solid var(--cc); background: var(--sunken);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mchip.is-done { opacity: .5; text-decoration: line-through; }
  .mmore { font-size: 10.5px; color: var(--ink-dim); font-family: var(--mono); }

  /* ---------- pomodoro ---------- */
  .pomo-bd { padding: 16px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .pomo-mode { font-size: 11.5px; letter-spacing: .1em; color: var(--ink-dim); }
  .pomo-mode.is-focus { color: var(--accent); }
  .pomo-clock {
    font-family: var(--mono); font-size: 42px; font-weight: 500; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .pomo-ring { width: 100%; height: 4px; background: var(--sunken); border-radius: 2px; overflow: hidden; }
  .pomo-ring i { display: block; height: 100%; background: var(--accent); transition: width .3s linear; }
  .pomo-act { display: flex; gap: 8px; width: 100%; }
  .pomo-act .btn { flex: 1; }
  .pomo-meta { display: flex; gap: 14px; font-size: 11.5px; color: var(--ink-dim); }
  .pomo-meta b { font-family: var(--mono); color: var(--ink); font-weight: 600; }
  .pomo-link { width: 100%; }
  .pomo-link select { width: 100%; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; font-size: 12.5px; }

  .day-list { display: flex; flex-direction: column; gap: 0; }

  /* ---------- phone ---------- */
  @media (max-width: 720px) {
    body { font-size: 15px; }
    .top { padding: 10px 12px; gap: 8px 14px; }
    .brand { font-size: 14px; width: 100%; }
    .stats { gap: 14px; }
    .stat b { font-size: 15px; }
    .top-actions { margin-left: 0; width: 100%; }
    .top-actions .btn { flex: 1; }
    .sync-note { width: 100%; }

    .wrap { padding: 12px; gap: 12px; }
    .rail { display: contents; }
    #card-today { order: 1; }
    #card-pomo { order: 2; }
    #card-plan { order: 3; }
    #card-courses { order: 4; }
    #card-import { order: 5; }

    .btn { min-height: 44px; padding: 10px 14px; }
    .btn-sm { min-height: 40px; }
    .tab { min-height: 40px; padding: 8px 18px; }
    input[type="checkbox"] { width: 22px; height: 22px; }
    .field input, .field select { min-height: 44px; }
    .mcell { min-height: 72px; }
    .today-item { padding: 12px 14px; gap: 12px; }
    .icon-btn { padding: 8px 10px; font-size: 15px; }
    .course { padding: 13px 14px; }
    .mcell { min-height: 68px; padding: 4px 3px; }
    .mchip { font-size: 9.5px; padding: 1px 3px; }
    .grid-hd, .grid-bd { min-width: 620px; }
    .grid-hd div { font-size: 11px; padding: 6px 2px; }
    .pomo-clock { font-size: 52px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 1080px) {
    .wrap { grid-template-columns: 1fr; }
    .rail { position: static; }
    .grid-scroll { overflow-x: auto; }
    .grid-hd, .grid-bd { min-width: 760px; }
    .grid-hd { position: static; }
  }
</style>

<header class="top">
  <div class="brand">课程排程台</div>
  <div class="stats">
    <div class="stat"><b id="s-courses" class="mono">0</b><span>课程</span></div>
    <div class="stat"><b id="s-hours" class="mono">0</b><span>周计划小时</span></div>
    <div class="stat"><b id="s-rate" class="mono">0%</b><span>本周完成</span></div>
  </div>
  <div class="top-actions">
    <span class="sync-note" id="sync-note"></span>
    <button class="btn btn-sm" id="btn-export">导出</button>
    <button class="btn btn-sm" id="btn-import-file">恢复备份</button>
    <button class="btn btn-sm btn-primary" id="btn-cloud">云端保存</button>
  </div>
</header>

<div class="wrap">
  <div class="rail">
    <section class="card" id="card-pomo">
      <div class="card-hd"><h2>番茄钟</h2><span class="count mono" id="pomo-today">今日 0</span></div>
      <div class="pomo-bd">
        <div class="pomo-mode is-focus" id="pomo-mode">专注</div>
        <div class="pomo-clock" id="pomo-clock">25:00</div>
        <div class="pomo-ring"><i id="pomo-ring" style="width:0%"></i></div>
        <div class="pomo-link">
          <select id="pomo-course" aria-label="关联课程"><option value="">不关联课程</option></select>
        </div>
        <div class="pomo-act">
          <button class="btn btn-primary" id="pomo-start">开始</button>
          <button class="btn" id="pomo-reset">重置</button>
          <button class="btn" id="pomo-skip">跳过</button>
        </div>
        <div class="pomo-meta">
          <span>第 <b id="pomo-round">1</b> 轮</span>
          <span>专注 <b id="pomo-f">25</b> 分</span>
          <span>休息 <b id="pomo-b">5</b> 分</span>
        </div>
      </div>
    </section>

    <section class="card" id="card-import">
      <div class="card-hd"><h2>导入课程</h2></div>
      <div class="card-bd">
        <textarea class="import" id="import-box" placeholder="每行一门课，支持三种写法：

线性代数 | https://www.bilibili.com/video/BV1...
[操作系统](https://www.icourse163.org/course/...)
https://www.coursera.org/learn/..."></textarea>
        <div class="import-row">
          <button class="btn btn-primary" id="btn-parse">解析并加入</button>
          <button class="btn" id="btn-clear-box">清空</button>
        </div>
        <p class="hint">沙箱禁止页面联网，<b>抓不到网页标题</b>。用 <code>标题 | 链接</code> 或 markdown 链接可一次带标题批量导入；只给链接时会从网址推断一个名字，之后可以改。</p>
      </div>
    </section>

    <section class="card" id="card-courses">
      <div class="card-hd"><h2>课程库</h2><span class="count" id="c-count">0</span></div>
      <div class="courses" id="course-list"></div>
    </section>

    <section class="card" id="card-today">
      <div class="card-hd"><h2>今天</h2><span class="count mono" id="today-date"></span></div>
      <div class="today-list" id="today-list"></div>
    </section>
  </div>

  <section class="card" id="card-plan">
    <div class="card-hd">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-week" aria-selected="true">周</button>
        <button class="tab" role="tab" id="tab-month" aria-selected="false">月</button>
      </div>
      <span class="count" id="plan-hint">点空白格新建，点色块编辑</span>
    </div>

    <div id="view-week">
      <div class="grid-scroll">
        <div class="grid-hd" id="grid-hd"></div>
        <div class="grid-bd" id="grid-bd"></div>
      </div>
    </div>

    <div id="view-month" hidden>
      <div class="month-hd">
        <button class="btn btn-sm" id="m-prev" aria-label="上个月">‹</button>

<script id="app-state" type="application/json">{"v":1,"courses":[],"blocks":[],"updatedAt":0}</script>
<script>
/* Capture the document exactly as published, before any rendering mutates it.
   Cloud saves rebuild from this, so the DOM is never serialized back. */
const PRISTINE = document.documentElement.outerHTML;

const DAYS = ["周一","周二","周三","周四","周五","周六","周日"];
const HOUR0 = 7, HOUR1 = 24;
const HOUR_H = 46;
const PALETTE = ["--c1","--c2","--c3","--c4","--c5","--c6"];
const LS_KEY = "course-planner-state";
const LS_POMO = "course-planner-pomo";
const POMO = { focus: 25, short: 5, long: 15, every: 4 };
const MODE_LABEL = { focus: "专注", short: "短休", long: "长休" };

const PLATFORMS = [
  [/bilibili\.com|b23\.tv/i,        "哔哩哔哩"],
  [/youtube\.com|youtu\.be/i,       "YouTube"],
  [/icourse163\.org/i,              "中国大学MOOC"],
  [/xuetangx\.com/i,                "学堂在线"],
  [/coursera\.org/i,                "Coursera"],
  [/edx\.org/i,                     "edX"],
  [/udemy\.com/i,                   "Udemy"],
  [/study\.163\.com|163\.com/i,     "网易云课堂"],
  [/imooc\.com/i,                   "慕课网"],
  [/time\.geekbang\.org/i,          "极客时间"],
  [/zhihu\.com/i,                   "知乎"],
  [/khanacademy\.org/i,             "可汗学院"],
  [/ocw\.mit\.edu|mit\.edu/i,       "MIT OCW"],
];

let state = { v: 1, courses: [], blocks: [], pomos: {}, updatedAt: 0 };
let artifactApi = null, downloadsApi = null;
let editingBlock = null, editingCourse = null, pickedColor = PALETTE[0];
let view = "week";
let monthAnchor = new Date();
let pomo = { mode: "focus", round: 1, endAt: null, remain: POMO.focus * 60000 };
let pomoTimer = null, audioCtx = null;

/* ---------- helpers ---------- */

const $ = (id) => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (m) => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const toMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));

function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
/* Monday-first index: JS getDay() is Sunday-first. */
function dayIdx(d) { return (d.getDay() + 6) % 7; }
function mondayOf(d) { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - dayIdx(x)); return x; }
function dateOfWeekday(i) { const m = mondayOf(new Date()); m.setDate(m.getDate() + i); return m; }

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function platformOf(url) {
  for (const [re, name] of PLATFORMS) if (re.test(url)) return name;
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return "链接"; }
}

/* Best-effort name from a bare URL. Never pretends to be the real title. */
function nameFromUrl(url) {
  try {
    const u = new URL(url);
    const bv = u.pathname.match(/BV[0-9A-Za-z]{10}/);
    if (bv) return "B站 " + bv[0];
    const segs = u.pathname.split("/").filter(Boolean);
    let last = segs.reverse().find(s => /[a-z]{3,}/i.test(s) && !/^(course|video|learn|watch|v|p)$/i.test(s));
    if (last) return decodeURIComponent(last).replace(/[-_+]/g, " ").replace(/\.\w{2,4}$/, "").slice(0, 48);
    return u.hostname.replace(/^www\./, "");
  } catch { return "未命名课程"; }
}

/* ---------- state ---------- */

function loadState() {
  let embedded = { v: 1, courses: [], blocks: [], pomos: {}, updatedAt: 0 };
  try { embedded = JSON.parse($("app-state").textContent) || embedded; } catch {}
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch {}
  if (local && (local.updatedAt || 0) > (embedded.updatedAt || 0)) {
    state = local;
    if ((embedded.courses || []).length || (embedded.blocks || []).length) {
      setTimeout(() => toast("已载入本机较新的数据"), 400);
    }
  } else {
    state = embedded;
  }
  state.courses = state.courses || [];
  state.blocks = state.blocks || [];
  state.pomos = state.pomos || {};
}

function touch() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {}
  render();
}

function stateDoc() {
  const json = JSON.stringify(state).replace(/</g, "\\u003c");
  return "<!doctype html>\n" + PRISTINE.replace(
    /(<script id="app-state" type="application\/json">)[\s\S]*?(<\/script>)/,
    (m, a, b) => a + json + b
  );
}

/* ---------- import ---------- */

function parseImport(text) {
  const out = [];
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line) continue;
    let title = "", url = "";

    const md = line.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/);
    const bar = line.match(/^(.+?)\s*[|｜]\s*(https?:\/\/\S+)/);
    const bare = line.match(/(https?:\/\/\S+)/);

    if (md) { title = md[1].trim(); url = md[2]; }
    else if (bar) { title = bar[1].trim(); url = bar[2]; }
    else if (bare) { url = bare[1]; title = nameFromUrl(url); }
    else continue;

    out.push({ title, url });
  }
  return out;
}

function addCourses(items) {
  let added = 0, dup = 0;
  for (const it of items) {
    if (state.courses.some(c => c.url === it.url)) { dup++; continue; }
    state.courses.push({
      id: uid(),
      title: it.title || nameFromUrl(it.url),
      url: it.url,
      platform: platformOf(it.url),
      total: 0,
      done: 0,
      color: PALETTE[state.courses.length % PALETTE.length],
    });
    added++;
  }
  touch();
  toast(added ? ("已加入 " + added + " 门课" + (dup ? "，跳过 " + dup + " 门重复" : "")) : "没有新课程可加入");
}

/* ---------- render ---------- */

function render() {
  renderStats();
  renderCourses();
  if (view === "week") renderGrid(); else renderMonth();
  renderToday();
  renderCourseOptions();
  renderPomoCourses();
}

/* 某个日期上排的学习块（周计划按星期重复到每一天） */
function blocksOn(date) {
  const i = dayIdx(date);
  return state.blocks.filter(b => b.day === i).sort((a, b) => a.start - b.start);
}
function isDone(b, iso) { return !!(b.doneOn && b.doneOn[iso]); }

function renderMonth() {
  const y = monthAnchor.getFullYear(), m = monthAnchor.getMonth();
  $("m-title").textContent = y + " 年 " + (m + 1) + " 月";
  $("month-dow").innerHTML = DAYS.map(d => "<div>" + d.replace("周", "") + "</div>").join("");

  const start = monthStart(y, m);
  const todayIso = isoDate(new Date());

  let cells = "";
  for (let k = 0; k < 42; k++) {
    const d = new Date(start);
    d.setDate(start.getDate() + k);
    const iso = isoDate(d);
    const out = d.getMonth() !== m;
    const items = blocksOn(d);
    const shown = items.slice(0, 3).map(b => {
      const c = state.courses.find(x => x.id === b.courseId);
      return '<span class="mchip ' + (isDone(b, iso) ? "is-done" : "") + '" style="--cc: var(' + (c ? c.color : "--c1") + ')">'
        + hhmm(b.start).slice(0, 5) + " " + esc(c ? c.title : "已删除") + "</span>";
    }).join("");
    const more = items.length > 3 ? '<span class="mmore">+' + (items.length - 3) + "</span>" : "";
    cells += '<button type="button" class="mcell ' + (out ? "is-out " : "") + (iso === todayIso ? "is-today" : "")
      + '" data-date="' + iso + '"><span class="mdate">' + d.getDate() + "</span>" + shown + more + "</button>";
  }
  $("month-grid").innerHTML = cells;
}

function openDay(iso) {
  const d = new Date(iso + "T12:00:00");
  const items = blocksOn(d);
  $("dlg-day-title").textContent = iso + " " + DAYS[dayIdx(d)];
  $("day-list").innerHTML = items.length ? items.map(b => {
    const c = state.courses.find(x => x.id === b.courseId);
    return '<label class="today-item ' + (isDone(b, iso) ? "is-done" : "") + '" style="--cc: var(' + (c ? c.color : "--c1") + ')">'
      + '<input type="checkbox" data-daydone="' + b.id + '" data-iso="' + iso + '"' + (isDone(b, iso) ? " checked" : "") + ">"
      + '<i class="t-dot"></i><span class="t-time mono">' + hhmm(b.start) + "</span>"
      + '<span class="t-name">' + esc(c ? c.title : "已删除的课程") + (b.note ? ' <span style="color:var(--ink-dim)">' + esc(b.note) + "</span>" : "") + "</span>"
      + (c && c.url ? '<a class="icon-btn" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer">↗</a>' : "")
      + "</label>";
  }).join("") : '<div class="empty">这天没有安排。</div>';
  $("dlg-day").showModal();
}

function setView(v) {
  view = v;
  $("tab-week").setAttribute("aria-selected", v === "week");
  $("tab-month").setAttribute("aria-selected", v === "month");
  $("view-week").hidden = v !== "week";
  $("view-month").hidden = v !== "month";
  $("plan-hint").textContent = v === "week" ? "点空白格新建，点色块编辑" : "点某天查看并打勾";
  render();
}

/* ---------- 番茄钟：一律用结束时间戳推算，后台节流也不会走偏 ---------- */

function pomoLen(mode) { return POMO[mode] * 60000; }

/* 纯函数：番茄钟的模式推进。专注结束进休息（每 every 轮进长休），休息结束进下一轮专注。 */
function pomoNext(mode, round) {
  if (mode === "focus") return { mode: round % POMO.every === 0 ? "long" : "short", round };
  return { mode: "focus", round: round + 1 };
}

/* 月视图 42 格的起始日：把当月 1 号所在那一周的周一作为第一格 */
function monthStart(year, month) {
  const first = new Date(year, month, 1);
  const s = new Date(first);
  s.setDate(1 - dayIdx(first));
  s.setHours(0, 0, 0, 0);
  return s;
}

function pomoRemain() {
  if (pomo.endAt) return Math.max(0, pomo.endAt - Date.now());
  return pomo.remain;
}

function savePomo() {
  try { localStorage.setItem(LS_POMO, JSON.stringify(pomo)); } catch {}
}

function renderPomo() {
  const left = pomoRemain();
  const total = pomoLen(pomo.mode);
  $("pomo-clock").textContent = pad(Math.floor(left / 60000)) + ":" + pad(Math.floor(left / 1000) % 60);
  $("pomo-ring").style.width = (total ? (1 - left / total) * 100 : 0) + "%";
  $("pomo-mode").textContent = MODE_LABEL[pomo.mode];
  $("pomo-mode").classList.toggle("is-focus", pomo.mode === "focus");
  $("pomo-round").textContent = pomo.round;
  $("pomo-f").textContent = POMO.focus;
  $("pomo-b").textContent = pomo.mode === "long" ? POMO.long : POMO.short;
  $("pomo-start").textContent = pomo.endAt ? "暂停" : "开始";
  $("pomo-today").textContent = "今日 " + (state.pomos[isoDate(new Date())] || 0);
  document.title = pomo.endAt
    ? pad(Math.floor(left / 60000)) + ":" + pad(Math.floor(left / 1000) % 60) + " " + MODE_LABEL[pomo.mode] + " · 课程排程台"
    : "课程排程台";
}

function beep() {
  try {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [0, 0.22, 0.44].forEach(off => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = 660;
      g.gain.setValueAtTime(0.0001, now + off);
      g.gain.exponentialRampToValueAtTime(0.25, now + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.18);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now + off); o.stop(now + off + 0.2);
    });
  } catch {}
  if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch {} }
}

function pomoTick() {
  if (pomo.endAt && Date.now() >= pomo.endAt) {
    const finished = pomo.mode;
    pomo.endAt = null;
    if (finished === "focus") {
      const iso = isoDate(new Date());
      state.pomos[iso] = (state.pomos[iso] || 0) + 1;
      const cid = $("pomo-course").value;
      const c = cid && state.courses.find(x => x.id === cid);
      if (c && c.total > 0 && c.done < c.total) c.done++;
      pomo.mode = pomoNext("focus", pomo.round).mode;
      toast("专注完成，休息一下");
      touch();
    } else {
      const n = pomoNext(finished, pomo.round);
      pomo.mode = n.mode;
      pomo.round = n.round;
      toast("休息结束，开始下一轮");
    }
    pomo.remain = pomoLen(pomo.mode);
    beep();
    savePomo();
  }
  renderPomo();
}

function pomoToggle() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  if (pomo.endAt) { pomo.remain = pomoRemain(); pomo.endAt = null; }
  else { pomo.endAt = Date.now() + (pomo.remain || pomoLen(pomo.mode)); }
  savePomo();
  renderPomo();
}

function pomoReset() {
  pomo.endAt = null;
  pomo.remain = pomoLen(pomo.mode);
  savePomo();
  renderPomo();
}

function pomoSkip() {
  const n = pomoNext(pomo.mode, pomo.round);
  pomo.mode = n.mode;
  pomo.round = n.round;
  pomo.endAt = null;
  pomo.remain = pomoLen(pomo.mode);
  savePomo();
  renderPomo();
}

function renderPomoCourses() {
  const sel = $("pomo-course");
  const keep = sel.value;
  sel.innerHTML = '<option value="">不关联课程</option>'
    + state.courses.map(c => '<option value="' + c.id + '">' + esc(c.title) + "</option>").join("");
  if (keep) sel.value = keep;
}

function weekDates() { return DAYS.map((_, i) => isoDate(dateOfWeekday(i))); }

function renderStats() {
  const mins = state.blocks.reduce((a, b) => a + b.dur, 0);
  const dates = weekDates();
  let total = 0, done = 0;
  state.blocks.forEach(b => { total++; if (b.doneOn && b.doneOn[dates[b.day]]) done++; });
  $("s-courses").textContent = state.courses.length;
  $("s-hours").textContent = (mins / 60).toFixed(1);
  $("s-rate").textContent = total ? Math.round(done / total * 100) + "%" : "0%";
  $("c-count").textContent = state.courses.length;
}

function renderCourses() {
  const box = $("course-list");
  if (!state.courses.length) {
    box.innerHTML = '<div class="empty">还没有课程。<br>在上面粘贴课程链接，一行一门。</div>';
    return;
  }
  box.innerHTML = state.courses.map(c => {
    const pct = c.total > 0 ? Math.min(100, Math.round(c.done / c.total * 100)) : 0;
    return '<div class="course" style="--cc: var(' + c.color + ')">'
      + '<i class="swatch"></i>'
      + '<div class="course-name">' + esc(c.title) + '</div>'
      + '<div class="course-act">'
        + (c.url ? '<a class="icon-btn" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer" title="打开课程">↗</a>' : '')
        + '<button class="icon-btn" data-edit="' + c.id + '" title="编辑">✎</button>'
      + '</div>'
      + '<div class="course-meta">'
        + '<span class="plat">' + esc(c.platform) + '</span>'
        + (c.total > 0
            ? '<span class="bar"><i style="width:' + pct + '%"></i></span><span class="mono">' + c.done + "/" + c.total + '</span>'
            : '<span>未设总节数</span>')
      + '</div>'
    + '</div>';
  }).join("");
}

function renderGrid() {
  const todayIdx = dayIdx(new Date());
  $("grid-hd").innerHTML = '<div></div>' + DAYS.map((d, i) => {
    const dt = dateOfWeekday(i);
    return '<div class="' + (i === todayIdx ? "is-today" : "") + '">' + d
      + '<em>' + (dt.getMonth() + 1) + "/" + dt.getDate() + '</em></div>';
  }).join("");

  const h = (HOUR1 - HOUR0) * HOUR_H;
  let hours = '<div class="hours" style="height:' + h + 'px">';
  for (let x = HOUR0; x <= HOUR1; x++) {
    hours += '<span style="top:' + ((x - HOUR0) * HOUR_H) + 'px">' + pad(x) + ':00</span>';
  }
  hours += "</div>";

  const dates = weekDates();
  const cols = DAYS.map((_, i) => {
    const items = state.blocks.filter(b => b.day === i).map(b => {
      const c = state.courses.find(x => x.id === b.courseId);
      const top = (b.start - HOUR0 * 60) / 60 * HOUR_H;
      const hh = Math.max(20, b.dur / 60 * HOUR_H - 2);
      const isDone = !!(b.doneOn && b.doneOn[dates[i]]);
      return '<div class="blk ' + (isDone ? "is-done" : "") + '" data-blk="' + b.id + '"'
        + ' style="--cc: var(' + (c ? c.color : "--c1") + ');top:' + top + 'px;height:' + hh + 'px">'
        + '<b>' + esc(c ? c.title : "已删除的课程") + '</b>'
        + '<span class="blk-time mono">' + hhmm(b.start) + " " + (b.dur >= 60 ? (b.dur / 60).toFixed(b.dur % 60 ? 1 : 0) + "h" : b.dur + "m") + '</span>'
        + (b.note ? '<span class="blk-time">' + esc(b.note) + '</span>' : '')
      + '</div>';
    }).join("");
    return '<div class="day ' + (i === todayIdx ? "is-today" : "") + '" data-day="' + i + '" style="height:' + h + 'px">' + items + '</div>';
  }).join("");

  $("grid-bd").innerHTML = hours + cols;
}

function renderToday() {
  const i = dayIdx(new Date());
  const date = isoDate(new Date());
  $("today-date").textContent = date;
  const items = state.blocks.filter(b => b.day === i).sort((a, b) => a.start - b.start);
  const box = $("today-list");
  if (!items.length) {
    box.innerHTML = '<div class="empty">今天没有安排。</div>';
    return;
  }
  box.innerHTML = items.map(b => {
    const c = state.courses.find(x => x.id === b.courseId);
    const done = !!(b.doneOn && b.doneOn[date]);
    return '<label class="today-item ' + (done ? "is-done" : "") + '" style="--cc: var(' + (c ? c.color : "--c1") + ')">'
      + '<input type="checkbox" data-done="' + b.id + '"' + (done ? " checked" : "") + '>'
      + '<i class="t-dot"></i>'
      + '<span class="t-time mono">' + hhmm(b.start) + '</span>'
      + '<span class="t-name">' + esc(c ? c.title : "已删除的课程") + (b.note ? ' <span style="color:var(--ink-dim)">' + esc(b.note) + '</span>' : '') + '</span>'
      + (c && c.url ? '<a class="icon-btn" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer" title="打开课程">↗</a>' : '')
    + '</label>';
  }).join("");
}

function renderCourseOptions() {
  const sel = $("f-course");
  sel.innerHTML = state.courses.map(c => '<option value="' + c.id + '">' + esc(c.title) + '</option>').join("");
  $("f-day").innerHTML = DAYS.map((d, i) => '<option value="' + i + '">' + d + '</option>').join("");
}

/* ---------- block dialog ---------- */

function openBlock(block, presetDay, presetStart) {
  if (!state.courses.length) { toast("先导入至少一门课程"); return; }
  editingBlock = block;
  $("dlg-block-title").textContent = block ? "编辑学习块" : "安排学习块";
  $("btn-block-del").style.display = block ? "" : "none";
  $("block-err").textContent = "";
  $("f-course").value = block ? block.courseId : state.courses[0].id;
  $("f-note").value = block ? (block.note || "") : "";
  $("f-day").value = block ? block.day : presetDay;
  $("f-start").value = hhmm(block ? block.start : presetStart);
  $("f-dur").value = block ? block.dur : 60;
  $("dlg-block").showModal();
}

function saveBlock() {
  const day = Number($("f-day").value);
  const start = toMin($("f-start").value || "00:00");
  const dur = Number($("f-dur").value);
  if (!Number.isFinite(dur) || dur < 10) { $("block-err").textContent = "时长至少 10 分钟。"; return; }
  if (start < HOUR0 * 60 || start + dur > HOUR1 * 60) {
    $("block-err").textContent = "时间需落在 " + pad(HOUR0) + ":00 到 " + pad(HOUR1 % 24) + ":00 之间。";
    return;
  }
  const clash = state.blocks.find(b =>
    b.day === day && (!editingBlock || b.id !== editingBlock.id) &&
    start < b.start + b.dur && b.start < start + dur
  );
  if (clash) { $("block-err").textContent = "和同一天 " + hhmm(clash.start) + " 的安排重叠了。"; return; }

  if (editingBlock) {
    Object.assign(editingBlock, { courseId: $("f-course").value, note: $("f-note").value.trim(), day, start, dur });
  } else {
    state.blocks.push({ id: uid(), courseId: $("f-course").value, note: $("f-note").value.trim(), day, start, dur, doneOn: {} });
  }
  $("dlg-block").close();
  touch();
}

/* ---------- course dialog ---------- */

function openCourse(c) {
  editingCourse = c;
  pickedColor = c.color;
  $("f-title").value = c.title;
  $("f-url").value = c.url || "";
  $("f-total").value = c.total || 0;
  $("f-done").value = c.done || 0;
  $("course-err").textContent = "";
  $("f-swatches").innerHTML = PALETTE.map(p =>
    '<button type="button" data-color="' + p + '" aria-pressed="' + (p === pickedColor) + '" style="--sw: var(' + p + ')" aria-label="标记色"></button>'
  ).join("");
  $("dlg-course").showModal();
}

function saveCourse() {
  const title = $("f-title").value.trim();
  if (!title) { $("course-err").textContent = "课程名不能为空。"; return; }
  const total = Math.max(0, Number($("f-total").value) || 0);
  let done = Math.max(0, Number($("f-done").value) || 0);
  if (total && done > total) done = total;
  const url = $("f-url").value.trim();
  Object.assign(editingCourse, { title, url, platform: url ? platformOf(url) : "无链接", total, done, color: pickedColor });
  $("dlg-course").close();
  touch();
}

/* ---------- export ---------- */

function icsBody() {
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//course-planner//ZH//", "CALSCALE:GREGORIAN"];
  const wrapText = (s) => String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
  for (const b of state.blocks) {
    const c = state.courses.find(x => x.id === b.courseId);
    const d = dateOfWeekday(b.day);
    const st = new Date(d); st.setMinutes(b.start);
    const en = new Date(st.getTime() + b.dur * 60000);
    const fmt = (x) => x.getFullYear() + pad(x.getMonth() + 1) + pad(x.getDate()) + "T" + pad(x.getHours()) + pad(x.getMinutes()) + "00";
    lines.push("BEGIN:VEVENT",
      "UID:" + b.id + "@course-planner",
      "DTSTART:" + fmt(st),
      "DTEND:" + fmt(en),
      "RRULE:FREQ=WEEKLY",
      "SUMMARY:" + wrapText(c ? c.title : "学习"),
      "DESCRIPTION:" + wrapText([b.note, c && c.url].filter(Boolean).join("\n")),
      "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

async function offer(filename, data, label) {
  if (downloadsApi) {
    try { await downloadsApi.save({ filename, data }); toast("已发送" + label); return; }
    catch { toast("下载被取消"); return; }
  }
  $("export-box").value = data;
  toast("此环境不能直接下载，请从下面的框里复制");
}

/* ---------- wiring ---------- */

function wire() {
  $("btn-parse").addEventListener("click", () => {
    const items = parseImport($("import-box").value);
    if (!items.length) { toast("没解析出链接，检查一下格式"); return; }
    addCourses(items);
    $("import-box").value = "";
  });
  $("btn-clear-box").addEventListener("click", () => { $("import-box").value = ""; });

  $("course-list").addEventListener("click", (e) => {
    const b = e.target.closest("[data-edit]");
    if (!b) return;
    const c = state.courses.find(x => x.id === b.dataset.edit);
    if (c) openCourse(c);
  });

  $("grid-bd").addEventListener("click", (e) => {
    const blk = e.target.closest("[data-blk]");
    if (blk) { openBlock(state.blocks.find(b => b.id === blk.dataset.blk)); return; }
    const day = e.target.closest("[data-day]");
    if (!day) return;
    const y = e.clientY - day.getBoundingClientRect().top;
    let mins = HOUR0 * 60 + Math.round(y / HOUR_H * 60 / 30) * 30;
    mins = Math.max(HOUR0 * 60, Math.min(HOUR1 * 60 - 60, mins));
    openBlock(null, Number(day.dataset.day), mins);
  });

  $("today-list").addEventListener("change", (e) => {
    const cb = e.target.closest("[data-done]");
    if (!cb) return;
    const b = state.blocks.find(x => x.id === cb.dataset.done);
    if (!b) return;
    b.doneOn = b.doneOn || {};
    const d = isoDate(new Date());
    if (cb.checked) b.doneOn[d] = true; else delete b.doneOn[d];
    touch();
  });

  $("btn-block-save").addEventListener("click", saveBlock);
  $("btn-block-del").addEventListener("click", () => {
    if (editingBlock) state.blocks = state.blocks.filter(b => b.id !== editingBlock.id);
    $("dlg-block").close();
    touch();
  });

  $("btn-course-save").addEventListener("click", saveCourse);
  $("btn-course-del").addEventListener("click", () => {
    if (!editingCourse) return;
    state.courses = state.courses.filter(c => c.id !== editingCourse.id);
    state.blocks = state.blocks.filter(b => b.courseId !== editingCourse.id);
    $("dlg-course").close();
    touch();
  });
  $("f-swatches").addEventListener("click", (e) => {
    const b = e.target.closest("[data-color]");
    if (!b) return;
    pickedColor = b.dataset.color;
    [...$("f-swatches").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  });

  $("btn-export").addEventListener("click", () => {
    $("export-box").value = JSON.stringify(state, null, 2);
    $("export-hint").textContent = downloadsApi
      ? "JSON 是完整备份，可用“恢复备份”读回。.ics 可导入系统日历，按周重复。"
      : "此环境不支持直接下载，请从下面复制 JSON 自行保存。";
    $("btn-dl-json").disabled = !downloadsApi;
    $("btn-dl-ics").disabled = !downloadsApi;
    $("dlg-export").showModal();
  });
  $("btn-export-close").addEventListener("click", () => $("dlg-export").close());
  $("btn-dl-json").addEventListener("click", () => offer("course-planner-backup.json", JSON.stringify(state, null, 2), " JSON 备份"));
  $("btn-dl-ics").addEventListener("click", () => offer("course-plan.ics", icsBody(), "日历文件"));

  $("btn-import-file").addEventListener("click", () => $("file-input").click());
  $("file-input").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.courses) || !Array.isArray(d.blocks)) throw new Error("shape");
        state = { v: 1, courses: d.courses, blocks: d.blocks, updatedAt: Date.now() };
        touch();
        toast("备份已恢复");
      } catch { toast("这个文件不是有效的备份"); }
    };
    r.readAsText(f);
    e.target.value = "";
  });

  $("tab-week").addEventListener("click", () => setView("week"));
  $("tab-month").addEventListener("click", () => setView("month"));
  $("m-prev").addEventListener("click", () => { monthAnchor.setDate(1); monthAnchor.setMonth(monthAnchor.getMonth() - 1); renderMonth(); });
  $("m-next").addEventListener("click", () => { monthAnchor.setDate(1); monthAnchor.setMonth(monthAnchor.getMonth() + 1); renderMonth(); });
  $("m-today").addEventListener("click", () => { monthAnchor = new Date(); renderMonth(); });
  $("month-grid").addEventListener("click", (e) => {
    const cell = e.target.closest("[data-date]");
    if (cell) openDay(cell.dataset.date);
  });
  $("day-list").addEventListener("change", (e) => {
    const cb = e.target.closest("[data-daydone]");
    if (!cb) return;
    const b = state.blocks.find(x => x.id === cb.dataset.daydone);
    if (!b) return;
    b.doneOn = b.doneOn || {};
    if (cb.checked) b.doneOn[cb.dataset.iso] = true; else delete b.doneOn[cb.dataset.iso];
    cb.closest(".today-item").classList.toggle("is-done", cb.checked);
    touch();
  });
  $("btn-day-close").addEventListener("click", () => $("dlg-day").close());

  $("pomo-start").addEventListener("click", pomoToggle);
  $("pomo-reset").addEventListener("click", pomoReset);
  $("pomo-skip").addEventListener("click", pomoSkip);

  $("btn-cloud").addEventListener("click", async () => {
    if (!artifactApi) { toast("此环境没有云端保存，数据已存在本机"); return; }
    const btn = $("btn-cloud");
    btn.disabled = true;
    btn.textContent = "保存中";
    try {
      await artifactApi.publish(stateDoc());
      toast("已保存到云端");
    } catch (err) {
      toast(err && err.code === "conflict" ? "别处刚保存过，页面将载入那一版" : "云端保存失败，数据仍在本机");
    } finally {
      btn.disabled = false;
      btn.textContent = "云端保存";
    }
  });
}

/* ---------- boot ---------- */

loadState();
try {
  const saved = JSON.parse(localStorage.getItem(LS_POMO) || "null");
  if (saved && MODE_LABEL[saved.mode]) pomo = saved;
} catch {}
wire();
/* 手机上默认月视图：周表在窄屏要横向滚，月视图才是拇指友好的 */
if (window.matchMedia && window.matchMedia("(max-width: 720px)").matches) view = "month";
setView(view);
renderPomo();
pomoTimer = setInterval(pomoTick, 250);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pomoTick(); });

$("sync-note").textContent = "本机已存";
if (!(window.claude && claude.use)) $("btn-cloud").hidden = true;
if (window.claude && claude.use) {
  claude.use("artifact").then(a => {
    artifactApi = a;
    $("sync-note").textContent = a ? "本机已存，可云端保存" : "本机已存";
    if (!a) $("btn-cloud").hidden = true;
  }).catch(() => {});
  claude.use("downloads").then(d => { downloadsApi = d; }).catch(() => {});
}
</script>

</body>
</html>
